# Basic syntax checks + secret detection, set up by the secret-management
# Claude Code skill. Safe to add other hooks alongside these - just don't
# remove them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
  - repo: https://github.com/google/yamlfmt
    rev: v0.13.0
    hooks:
      - id: yamlfmt
        name: "format: auto-format YAML"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: "python: lint and autofix with Ruff"
        args: [--fix]
      - id: ruff-format
        name: "python: format with Ruff"
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: "shell: lint with ShellCheck"
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        name: "shell: format with shfmt"
        args: [-w, -i, "2", -ci, -sr]
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.25
    hooks:
      - id: pymarkdown
        name: "markdown: lint with PyMarkdown"
        # GOALS.md intentionally uses numbered H1 sections and long tables;
        # WORKLOG.md is generated by the append-only worklog helper.
        args: ["-d", "MD013,MD022,MD024,MD025,MD036", "scan"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-case-conflict
        name: "filesystem: check case sensitivity"
      - id: check-executables-have-shebangs
        name: "filesystem: verify shebang presence"
      - id: check-shebang-scripts-are-executable
        name: "filesystem: verify script permissions"
      - id: check-symlinks
        name: "filesystem: check symlink validity"
      - id: destroyed-symlinks
        name: "git: detect broken symlinks"
      - id: forbid-new-submodules
        name: "git: prevent submodule creation"
      - id: mixed-line-ending
        name: "format: fix line endings"
        args: [--fix=lf]
      - id: fix-byte-order-marker
        name: "format: remove UTF-8 BOM"
      - id: detect-private-key
        name: "security: detect private keys"
default_language_version:
  python: python3
